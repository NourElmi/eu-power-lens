[project]
name = "eu-power-lens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nour.elkhoumssi", email = "nourelhoudaelkhoumssi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "entsoe-py>=1.0.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
eu-power-lens = "eu_power_lens:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
